name: Flat watcher

on:
  schedule:
    # Сдвиг на 3-ю минуту: в :00 у GitHub очередь и запуски опаздывают сильнее.
    # Время в cron — UTC. Братислава зимой UTC+1, летом UTC+2 (тогда всё на час позже).
    - cron: "3-59/10 5-23 * * *"   # днём каждые 10 минут: 06:00–00:59 по Братиславе
    - cron: "3 0-4 * * *"          # ночью раз в час: 01:03–05:03 по Братиславе
  workflow_dispatch: {}   # кнопка "Run workflow" для ручного запуска

permissions:
  contents: write         # чтобы закоммитить seen.json
  actions: read           # чтобы узнать, чем закончился прошлый прогон

concurrency:
  group: flat-watcher     # два прогона одновременно не идут
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # до 25 объявлений с фото и паузами между ними — около 5 минут
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check listings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # MAX_PRICE: "901"   # необязательный доп. фильтр по цене, € в месяц
        run: python watcher.py

      - name: Save seen.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "Ничего нового"
          else
            git commit -m "Update seen listings"
            git pull --rebase --autostash
            git push
          fi

      # Если прогон упал целиком — пишем в Telegram. Только при первом падении
      # после успешного прогона (без спама каждые 10 минут) и один раз при починке.
      - name: Notify on failure / recovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Чем закончился предыдущий прогон (отменённые и пропущенные не считаем)
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow watch.yml --limit 20 \
            --json databaseId,conclusion \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.conclusion == \"success\" or .conclusion == \"failure\"))][0].conclusion")
          echo "Сейчас: $STATUS, прошлый: $prev"
          text=""
          if [ "$STATUS" = "failure" ] && [ "$prev" != "failure" ]; then
            text="❌ Flat watcher упал целиком — объявления сейчас не проверяются. Логи: $RUN_URL"
          elif [ "$STATUS" = "success" ] && [ "$prev" = "failure" ]; then
            text="✅ Flat watcher снова работает."
          fi
          if [ -n "$text" ]; then
            curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$text" > /dev/null
          fi
